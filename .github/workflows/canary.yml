# GENERATED by tools/mirror-satellites.sh — edit there, not here.
name: canary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canary
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Reset the rolling canary prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # This build's own version: <base>-canary.<utc-date>.<run-number>, where the
          # base is the in-tree version advanced past any published stable release.
          # Ordered by semver precedence, so two rolling builds are comparable and a
          # prerelease always ranks below its finished stable.
          VERSION="$(node scripts/next-version.mjs canary)"
          echo "Canary version: $VERSION"
          gh release delete canary --yes --cleanup-tag || true
          {
            printf '## Canary `%s`\n\n' "$VERSION"
            printf 'Rolling **canary** build of `ryu-simulator` from `main` — not a stable release.\n\n'
            printf 'Built from commit %s.\n\n' "${GITHUB_SHA}"
            printf 'Installed Ryu nodes never auto-update onto rolling builds; the updater only\n'
            printf 'tracks the latest tagged v* release. Use the tagged releases for anything real.\n'
          } > notes.md
          # TITLE FORMAT IS A CONTRACT, not decoration: `canary` is a ROLLING tag that
          # carries no version, so the version is recovered by scanning this title for a
          # semver token (see `release_version` in apps/core/src/update/mod.rs). Keep it
          # a bare whitespace-delimited token; the commit stays in parens.
          gh release create canary --prerelease --target "$GITHUB_SHA" \
            --title "Canary $VERSION (${GITHUB_SHA:0:12})" --notes-file notes.md

  build:
    needs: prepare
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - name: Test
        working-directory: sidecar
        shell: bash
        run: |
          set -euo pipefail
          bun install
          bun run test
      - name: Build
        working-directory: sidecar
        shell: bash
        run: |
          set -euo pipefail
          bun run build
      - name: Package
        working-directory: sidecar
        shell: bash
        run: |
          set -euo pipefail
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          case "${{ runner.os }}" in
            Linux)   plat="linux-x86_64" ;;
            macOS)   plat="macos-aarch64" ;;
            Windows) plat="windows-x86_64" ;;
          esac
          mkdir -p out
          cp "dist/ryu-simulator${ext}" "out/ryu-simulator-${plat}${ext}"
          ( cd out
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "ryu-simulator-${plat}${ext}" > "ryu-simulator-${plat}${ext}.sha256"
            elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "ryu-simulator-${plat}${ext}" > "ryu-simulator-${plat}${ext}.sha256"; fi )
      # gh release upload, NOT softprops: softprops PATCHes the release even
      # when it is only ADDING assets, and that PATCH is refused for the App
      # token ("Resource not accessible by integration") despite Contents:
      # write. The assets endpoint on its own is permitted.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: canary
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(sidecar/out/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no files matched" >&2; exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
